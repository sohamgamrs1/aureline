<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aureline" />
    <meta
      name="description"
      content="Aureline is a private, in-browser face analysis app. Upload a selfie, see your proportions measured with 478 facial landmarks, and get a personal glow-up routine. Nothing ever leaves your device."
    />
    <title>Aureline — Know your face. Elevate your presence.</title>
  </head>
    <!--
      Boot guard. A packaged WebView shows a blank white screen when the bundle
      throws before React mounts, which tells you nothing. This turns that into a
      readable message. Registered before the module script so it catches
      module-evaluation failures, which no React error boundary can see.
    -->
    <script>
      (function () {
        function panel(title, detail) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            "padding:24px;box-sizing:border-box;background:#0A0A0F;color:#F5F5F7;" +
            "font-family:Inter,system-ui,-apple-system,sans-serif;text-align:left;line-height:1.6">" +
            '<div style="max-width:520px;width:100%;border:1px solid rgba(212,175,55,.28);' +
            'border-radius:20px;background:#0E0E15;padding:28px;box-shadow:0 18px 50px -24px #000">' +
            '<div style="font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#D4AF37">' +
            "Aureline &middot; startup</div>" +
            '<div style="font-family:Georgia,serif;font-size:22px;margin:14px 0 10px;color:#fff">' +
            title +
            "</div>" +
            '<div style="font-size:13px;color:#9CA3AF">The app did not finish loading. ' +
            "Send the detail below to get it fixed.</div>" +
            '<pre style="margin-top:16px;max-height:220px;overflow:auto;white-space:pre-wrap;' +
            "word-break:break-word;background:#07070B;border:1px solid rgba(255,255,255,.08);" +
            'border-radius:12px;padding:14px;font-size:11px;color:#F4E6BF">' +
            String(detail).replace(/[<>&]/g, function (c) {
              return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
            }) +
            "</pre></div></div>";
        }
        window.addEventListener("error", function (e) {
          panel("Couldn&rsquo;t start", (e && e.message) || "Unknown error");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          panel("Couldn&rsquo;t start", (r && (r.message || r)) || "Unhandled rejection");
        });
        window.setTimeout(function () {
          panel(
            "Taking too long",
            "The bundle loaded but React never mounted. Most often this means a " +
              "dependency could not be fetched at runtime."
          );
        }, 8000);
      })();
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
